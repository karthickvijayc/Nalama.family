name: Build CI & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Containerize & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Code Quality & Type Check
        run: |
          npm run lint

      - name: Build Application
        run: |
          npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Environment & GCP Project
        id: config
        run: |
          # Priority: Step auth output -> GCP_PROJECT_ID secret -> vars.GCP_PROJECT_ID
          PROJECT_ID="${{ steps.auth.outputs.project_id || secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}"
          PROJECT_ID=$(echo "$PROJECT_ID" | tr -d '[:space:]')
          
          REGION="${{ secrets.GCP_REGION || vars.GCP_REGION || 'asia-southeast1' }}"
          REGION=$(echo "$REGION" | tr -d '[:space:]')
          
          REPO="${{ secrets.GCP_GAR_REPOSITORY || vars.GCP_GAR_REPOSITORY || 'nalama-family' }}"
          REPO=$(echo "$REPO" | tr -d '[:space:]')
          
          SERVICE="${{ secrets.GCP_CLOUDRUN_SERVICE || vars.GCP_CLOUDRUN_SERVICE || 'nalama-family' }}"
          SERVICE=$(echo "$SERVICE" | tr -d '[:space:]')
          
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Error: Could not determine GCP Project ID. Please ensure GCP_SA_KEY is valid or set GCP_PROJECT_ID in repository secrets."
            exit 1
          fi
          
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "GAR_REGION=$REGION" >> $GITHUB_ENV
          echo "GAR_REPO=$REPO" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE" >> $GITHUB_ENV
          echo "IMAGE_NAME=nalama-family" >> $GITHUB_ENV
          
          echo "Setting gcloud default project to $PROJECT_ID..."
          gcloud config set project "$PROJECT_ID" --quiet

      - name: Enable GCP Services
        run: |
          echo "Enabling Cloud Run & Artifact Registry APIs..."
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com --project="$PROJECT_ID" --quiet || true

      - name: Setup Artifact Registry Docker Repository
        run: |
          echo "Checking Artifact Registry repository $GAR_REPO in $GAR_REGION..."
          if ! gcloud artifacts repositories describe "$GAR_REPO" --location="$GAR_REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Creating Docker repository $GAR_REPO..."
            gcloud artifacts repositories create "$GAR_REPO" \
              --repository-format=docker \
              --location="$GAR_REGION" \
              --description="Nalama Family repository" \
              --project="$PROJECT_ID" \
              --quiet || true
          else
            echo "Repository $GAR_REPO exists."
          fi

      - name: Authenticate Docker with Artifact Registry
        run: |
          echo "Configuring Docker credential helper for ${GAR_REGION}-docker.pkg.dev..."
          gcloud auth configure-docker "${GAR_REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Docker Container
        run: |
          REGISTRY="${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}"
          IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          LATEST_TAG="${REGISTRY}/${IMAGE_NAME}:latest"
          
          echo "Building Docker container image ($IMAGE_TAG)..."
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          
          echo "Pushing Docker images to Artifact Registry..."
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Clear Conflicting Source Annotations
        run: |
          # If the service was previously created from source or console buildpacks,
          # remove stale 'run.googleapis.com/sources' and base-images annotations so container images deploy cleanly.
          if gcloud run services describe "$SERVICE_NAME" --region "$GAR_REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Removing any legacy source/base-image annotations from $SERVICE_NAME..."
            gcloud run services update "$SERVICE_NAME" \
              --region "$GAR_REGION" \
              --project "$PROJECT_ID" \
              --remove-annotations "run.googleapis.com/sources,run.googleapis.com/base-images" \
              --clear-base-image \
              --quiet || echo "Annotation cleanup step bypassed."
          else
            echo "Service $SERVICE_NAME does not exist yet. It will be created on first deploy."
          fi

      - name: Deploy to Google Cloud Run
        id: deploy
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REGISTRY="${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          
          echo "Deploying service $SERVICE_NAME with image $IMAGE to region $GAR_REGION..."
          
          # Attempt primary deployment
          if ! gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$GAR_REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production" \
            --quiet; then
            
            echo "⚠️ Initial deploy encountered conflicting service configuration. Retrying with --clear-base-image..."
            gcloud run deploy "$SERVICE_NAME" \
              --image "$IMAGE" \
              --region "$GAR_REGION" \
              --project "$PROJECT_ID" \
              --clear-base-image \
              --allow-unauthenticated \
              --memory 512Mi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 5 \
              --set-env-vars "NODE_ENV=production" \
              --quiet
          fi
          
          # Optional: Attach GEMINI_API_KEY from Secret Manager or GitHub Secret if present
          if gcloud secrets describe GEMINI_API_KEY --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Attaching GEMINI_API_KEY from Google Secret Manager..."
            gcloud run services update "$SERVICE_NAME" \
              --region "$GAR_REGION" \
              --project "$PROJECT_ID" \
              --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" \
              --quiet || echo "Secret Manager binding skipped."
          elif [ -n "$GEMINI_API_KEY_SECRET" ]; then
            echo "Setting GEMINI_API_KEY from GitHub Secret..."
            gcloud run services update "$SERVICE_NAME" \
              --region "$GAR_REGION" \
              --project "$PROJECT_ID" \
              --update-env-vars "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" \
              --quiet || true
          fi
          
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GAR_REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          
          echo "=========================================================="
          echo "🚀 Successfully deployed to Google Cloud Run!"
          echo "URL: $SERVICE_URL"
          echo "=========================================================="

      - name: Deployment Summary
        run: |
          echo "=========================================================="
          echo "✅ CI/CD Workflow completed successfully!"
          echo "Public Live URL: ${{ steps.deploy.outputs.service_url }}"
          echo "=========================================================="
