name: Build CI & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Containerize & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets & Setup Environment
        id: prep
        run: |
          RAW_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          RAW_SA_KEY="${{ secrets.GCP_SA_KEY }}"
          
          # Trim potential whitespace
          PROJECT_ID=$(echo "$RAW_PROJECT_ID" | tr -d '[:space:]')
          GAR_REGION="${{ secrets.GCP_REGION || 'asia-southeast1' }}"
          GAR_REPO="${{ secrets.GCP_GAR_REPOSITORY || 'nalama-family' }}"
          SERVICE_NAME="${{ secrets.GCP_CLOUDRUN_SERVICE || 'nalama-family' }}"
          
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Error: GCP_PROJECT_ID secret is not set in GitHub repository settings."
            echo "Please go to Settings > Secrets and variables > Actions and add GCP_PROJECT_ID."
            exit 1
          fi
          if [ -z "$RAW_SA_KEY" ]; then
            echo "❌ Error: GCP_SA_KEY secret is not set in GitHub repository settings."
            echo "Please go to Settings > Secrets and variables > Actions and add GCP_SA_KEY with your Service Account JSON key."
            exit 1
          fi
          
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "GAR_REGION=$GAR_REGION" >> $GITHUB_ENV
          echo "GAR_REPO=$GAR_REPO" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
          echo "IMAGE_NAME=nalama-family" >> $GITHUB_ENV
          
          echo "✅ Project ID and configuration prepared successfully."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Run CI Validation
        run: |
          npm ci || npm install
          npm run lint
          npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Project & APIs
        run: |
          gcloud config set project "$PROJECT_ID"
          echo "Configured default project to $PROJECT_ID."
          
          echo "Ensuring required GCP APIs are active..."
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com --quiet || true

      - name: Ensure Artifact Registry Exists & Configure Docker
        run: |
          echo "Checking Artifact Registry repository $GAR_REPO in $GAR_REGION..."
          if ! gcloud artifacts repositories describe "$GAR_REPO" --location="$GAR_REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repository $GAR_REPO..."
            gcloud artifacts repositories create "$GAR_REPO" \
              --repository-format=docker \
              --location="$GAR_REGION" \
              --description="Nalama Family container repository" \
              --project="$PROJECT_ID" \
              --quiet || true
          else
            echo "Repository $GAR_REPO is ready."
          fi
          
          echo "Configuring Docker authentication..."
          gcloud auth configure-docker "${GAR_REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Docker Container
        run: |
          REGISTRY="${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}"
          IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          LATEST_TAG="${REGISTRY}/${IMAGE_NAME}:latest"
          
          echo "Building Docker container image..."
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          
          echo "Pushing Docker image to Artifact Registry..."
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Google Cloud Run
        id: deploy
        run: |
          REGISTRY="${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          
          echo "Deploying $SERVICE_NAME to Cloud Run in $GAR_REGION..."
          
          # Deploy image to Cloud Run
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$GAR_REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production"
          
          # Optional: Attach GEMINI_API_KEY from Secret Manager or GitHub Secret if available
          if gcloud secrets describe GEMINI_API_KEY --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Attaching GEMINI_API_KEY from Google Secret Manager..."
            gcloud run services update "$SERVICE_NAME" \
              --region "$GAR_REGION" \
              --project "$PROJECT_ID" \
              --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" || echo "Secret Manager binding skipped."
          elif [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Setting GEMINI_API_KEY from GitHub Secret..."
            gcloud run services update "$SERVICE_NAME" \
              --region "$GAR_REGION" \
              --project "$PROJECT_ID" \
              --update-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" || true
          fi
          
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GAR_REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          
          echo "=========================================================="
          echo "🚀 Successfully deployed to Google Cloud Run!"
          echo "URL: $SERVICE_URL"
          echo "=========================================================="

      - name: Final Summary
        run: |
          echo "=========================================================="
          echo "✅ Deployment finished successfully!"
          echo "Public Application URL: ${{ steps.deploy.outputs.service_url }}"
          echo "=========================================================="
