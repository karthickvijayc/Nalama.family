name: Build CI & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GAR_REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
  GAR_REPO: ${{ secrets.GCP_GAR_REPOSITORY || 'nalama-family' }}
  SERVICE_NAME: ${{ secrets.GCP_CLOUDRUN_SERVICE || 'nalama-family' }}
  IMAGE_NAME: nalama-family

jobs:
  build-and-deploy:
    name: Build, Containerize & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ Error: GCP_PROJECT_ID secret is not set in GitHub repository settings."
            echo "Please go to Settings > Secrets and variables > Actions and add GCP_PROJECT_ID."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ Error: GCP_SA_KEY secret is not set in GitHub repository settings."
            echo "Please go to Settings > Secrets and variables > Actions and add GCP_SA_KEY with your Service Account JSON key."
            exit 1
          fi
          echo "✅ Required GitHub secrets are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Run CI Validation
        run: |
          npm ci || npm install
          npm run lint
          npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Project & Enable APIs
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          gcloud config set project "$PROJECT_ID"
          
          echo "Ensuring Cloud Run and Artifact Registry APIs are enabled..."
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com --project="$PROJECT_ID" --quiet || true

      - name: Ensure Artifact Registry Exists & Configure Docker
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ env.GAR_REGION }}"
          REPO="${{ env.GAR_REPO }}"
          
          echo "Checking Artifact Registry repository $REPO in $REGION..."
          if ! gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Repository not found. Creating Artifact Registry repository $REPO..."
            gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --description="Nalama Family container repository" \
              --project="$PROJECT_ID" \
              --quiet || true
          else
            echo "Repository $REPO exists."
          fi
          
          echo "Configuring Docker authentication..."
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Docker Container
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ env.GAR_REGION }}"
          REPO="${{ env.GAR_REPO }}"
          
          REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}"
          IMAGE_TAG="${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${REGISTRY}/${{ env.IMAGE_NAME }}:latest"
          
          echo "Building Docker image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          
          echo "Pushing Docker image to Artifact Registry..."
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Google Cloud Run
        id: deploy
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ env.GAR_REGION }}"
          REPO="${{ env.GAR_REPO }}"
          SERVICE="${{ env.SERVICE_NAME }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          echo "Deploying $SERVICE to Cloud Run in region $REGION..."
          
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production" \
            --quiet
          
          # Check and attach GEMINI_API_KEY from Secret Manager if configured
          if gcloud secrets describe GEMINI_API_KEY --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Attaching GEMINI_API_KEY from Google Secret Manager..."
            gcloud run services update "$SERVICE" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" \
              --quiet || echo "Note: Secret Manager binding skipped (check IAM permissions if needed)."
          elif [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Setting GEMINI_API_KEY from GitHub Secret..."
            gcloud run services update "$SERVICE" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},NODE_ENV=production" \
              --quiet || true
          fi
          
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          
          echo "=========================================================="
          echo "🚀 Successfully deployed to Google Cloud Run!"
          echo "URL: $SERVICE_URL"
          echo "=========================================================="

      - name: Output Service URL
        run: |
          echo "Deployment finished successfully."
          echo "Live URL: ${{ steps.deploy.outputs.service_url }}"
